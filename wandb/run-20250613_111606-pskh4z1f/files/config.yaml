_cfg_dict:
    value:
        auto_scale_lr:
            base_batch_size: 16
            enable: false
        backend_args: null
        classes:
            - Vehicle
            - Human
        custom_hooks:
            - init_kwargs:
                config:
                    batch_size: 4
                    epochs: 24
                    lr: 0.01
                name: hinton-deliver_geminifusion_rcnn_lr0.01
                project: geminifusion_1
              interval: 50
              log_checkpoint: false
              log_checkpoint_metadata: true
              num_eval_images: 10
              type: WandbHook
        data_preprocessor:
            mean_:
                - - 0.485
                  - 0.456
                  - 0.406
                - - 0
                  - 0
                  - 0
                - - 0
                  - 0
                  - 0
                - - 0
                  - 0
                  - 0
            pad_size_divisor: 32
            std_:
                - - 0.229
                  - 0.224
                  - 0.225
                - - 1
                  - 1
                  - 1
                - - 1
                  - 1
                  - 1
                - - 1
                  - 1
                  - 1
            type: ListDataPreprocessor
        data_root: /SSDb/jemo_maeng/dset/DELIVER
        dataset_type: DELIVERDetectionDataset
        default_hooks:
            checkpoint:
                interval: 1
                save_best: coco/bbox_mAP
                type: CheckpointHook
            logger:
                interval: 50
                type: LoggerHook
            param_scheduler:
                type: ParamSchedulerHook
            sampler_seed:
                type: DistSamplerSeedHook
            timer:
                type: IterTimerHook
            visualization:
                type: DetVisualizationHook
        default_scope: mmdet
        env_cfg:
            cudnn_benchmark: false
            dist_cfg:
                backend: nccl
            mp_cfg:
                mp_start_method: fork
                opencv_num_threads: 0
        experiment_name: deliver_cmnext_b2_faster_rcnn_2x_lr0.01
        load_from: null
        log_level: INFO
        log_processor:
            by_epoch: true
            type: LogProcessor
            window_size: 50
        model:
            backbone:
                backbone: GeminiFusion-B2
                frozen_stages: -1
                modals:
                    - rgb
                    - depth
                    - event
                    - lidar
                out_indices:
                    - 0
                    - 1
                    - 2
                    - 3
                type: GeminiFusion
            data_preprocessor:
                mean_:
                    - - 0.485
                      - 0.456
                      - 0.406
                    - - 0
                      - 0
                      - 0
                    - - 0
                      - 0
                      - 0
                    - - 0
                      - 0
                      - 0
                pad_size_divisor: 32
                std_:
                    - - 0.229
                      - 0.224
                      - 0.225
                    - - 1
                      - 1
                      - 1
                    - - 1
                      - 1
                      - 1
                    - - 1
                      - 1
                      - 1
                type: ListDataPreprocessor
            neck:
                in_channels:
                    - 64
                    - 128
                    - 320
                    - 512
                num_outs: 5
                out_channels: 256
                type: FPN
            roi_head:
                bbox_head:
                    bbox_coder:
                        target_means:
                            - 0
                            - 0
                            - 0
                            - 0
                        target_stds:
                            - 0.1
                            - 0.1
                            - 0.2
                            - 0.2
                        type: DeltaXYWHBBoxCoder
                    fc_out_channels: 1024
                    in_channels: 256
                    loss_bbox:
                        loss_weight: 1
                        type: L1Loss
                    loss_cls:
                        loss_weight: 1
                        type: CrossEntropyLoss
                        use_sigmoid: false
                    num_classes: 2
                    reg_class_agnostic: false
                    roi_feat_size: 7
                    type: Shared2FCBBoxHead
                bbox_roi_extractor:
                    featmap_strides:
                        - 4
                        - 8
                        - 16
                        - 32
                    out_channels: 256
                    roi_layer:
                        output_size: 7
                        sampling_ratio: 0
                        type: RoIAlign
                    type: SingleRoIExtractor
                type: StandardRoIHead
            rpn_head:
                anchor_generator:
                    ratios:
                        - 0.5
                        - 1
                        - 2
                    scales:
                        - 2
                        - 4
                        - 8
                        - 16
                    strides:
                        - 4
                        - 8
                        - 16
                        - 32
                        - 64
                    type: AnchorGenerator
                bbox_coder:
                    target_means:
                        - 0
                        - 0
                        - 0
                        - 0
                    target_stds:
                        - 1
                        - 1
                        - 1
                        - 1
                    type: DeltaXYWHBBoxCoder
                feat_channels: 256
                in_channels: 256
                loss_bbox:
                    loss_weight: 1
                    type: L1Loss
                loss_cls:
                    loss_weight: 1
                    type: CrossEntropyLoss
                    use_sigmoid: true
                type: RPNHead
            test_cfg:
                rcnn:
                    max_per_img: 100
                    nms:
                        iou_threshold: 0.5
                        type: nms
                    score_thr: 0.05
                rpn:
                    max_per_img: 1000
                    min_bbox_size: 0
                    nms:
                        iou_threshold: 0.7
                        type: nms
                    nms_pre: 1000
            train_cfg:
                rcnn:
                    assigner:
                        ignore_iof_thr: -1
                        match_low_quality: false
                        min_pos_iou: 0.5
                        neg_iou_thr: 0.5
                        pos_iou_thr: 0.5
                        type: MaxIoUAssigner
                    debug: false
                    pos_weight: -1
                    sampler:
                        add_gt_as_proposals: true
                        neg_pos_ub: -1
                        num: 512
                        pos_fraction: 0.25
                        type: RandomSampler
                rpn:
                    allowed_border: -1
                    assigner:
                        ignore_iof_thr: -1
                        match_low_quality: true
                        min_pos_iou: 0.3
                        neg_iou_thr: 0.3
                        pos_iou_thr: 0.7
                        type: MaxIoUAssigner
                    debug: false
                    pos_weight: -1
                    sampler:
                        add_gt_as_proposals: false
                        neg_pos_ub: -1
                        num: 256
                        pos_fraction: 0.5
                        type: RandomSampler
                rpn_proposal:
                    max_per_img: 1000
                    min_bbox_size: 0
                    nms:
                        iou_threshold: 0.7
                        type: nms
                    nms_pre: 2000
            type: FasterRCNN
        optim_wrapper:
            accumulative_counts: 4
            clip_grad:
                max_norm: 5
                norm_type: 2
            optimizer:
                lr: 0.01
                momentum: 0.9
                type: SGD
                weight_decay: 0.0001
            type: OptimWrapper
        param_scheduler:
            - begin: 0
              by_epoch: false
              end: 500
              start_factor: 0.001
              type: LinearLR
            - begin: 0
              by_epoch: true
              end: 24
              gamma: 0.1
              milestones:
                - 16
                - 22
              type: MultiStepLR
        randomness:
            deterministic: false
            seed: 0
        resume: false
        test_cfg:
            type: TestLoop
        test_dataloader:
            batch_size: 1
            dataset:
                ann_file: coco_val_xywh.json
                data_prefix:
                    img: ""
                data_root: /SSDb/jemo_maeng/dset/DELIVER
                metainfo:
                    classes:
                        - Vehicle
                        - Human
                    palette:
                        - - 220
                          - 20
                          - 60
                        - - 119
                          - 11
                          - 32
                pipeline:
                    - type: LoadDELIVERImages
                    - bbox_format: xywh
                      img_scale:
                        - 512
                        - 512
                      keep_ratio: true
                      type: DELIVERResize
                    - type: PackDELIVERDetInputs
                test_mode: true
                type: DELIVERDetectionDataset
            drop_last: false
            num_workers: 2
            persistent_workers: true
            sampler:
                shuffle: false
                type: DefaultSampler
        test_evaluator:
            ann_file: /mnt/nvme/workspace/AnySeg/data/DELIVER/coco_val_xywh.json
            format_only: false
            metric: bbox
            type: CocoMetric
        test_pipeline:
            - type: LoadDELIVERImages
            - bbox_format: xywh
              img_scale:
                - 512
                - 512
              keep_ratio: true
              type: DELIVERResize
            - type: PackDELIVERDetInputs
        train_cfg:
            max_epochs: 24
            type: EpochBasedTrainLoop
            val_interval: 1
        train_dataloader:
            batch_size: 4
            dataset:
                ann_file: coco_train_xywh.json
                data_prefix:
                    img: ""
                data_root: /SSDb/jemo_maeng/dset/DELIVER
                filter_cfg:
                    filter_empty_gt: true
                    min_size: 32
                metainfo:
                    classes:
                        - Vehicle
                        - Human
                    palette:
                        - - 220
                          - 20
                          - 60
                        - - 119
                          - 11
                          - 32
                pipeline:
                    - type: LoadDELIVERImages
                    - type: LoadAnnotations
                      with_bbox: true
                    - bbox_format: xywh
                      img_scale:
                        - 512
                        - 512
                      keep_ratio: true
                      type: DELIVERResize
                    - bbox_format: xywh
                      prob: 0.5
                      type: DELIVERRandomFlip
                    - type: PackDELIVERDetInputs
                type: DELIVERDetectionDataset
            num_workers: 2
            persistent_workers: true
            sampler:
                shuffle: true
                type: DefaultSampler
        train_pipeline:
            - type: LoadDELIVERImages
            - type: LoadAnnotations
              with_bbox: true
            - bbox_format: xywh
              img_scale:
                - 512
                - 512
              keep_ratio: true
              type: DELIVERResize
            - bbox_format: xywh
              prob: 0.5
              type: DELIVERRandomFlip
            - type: PackDELIVERDetInputs
        val_cfg:
            type: ValLoop
        val_dataloader:
            batch_size: 1
            dataset:
                ann_file: coco_val_xywh.json
                data_prefix:
                    img: ""
                data_root: /SSDb/jemo_maeng/dset/DELIVER
                metainfo:
                    classes:
                        - Vehicle
                        - Human
                    palette:
                        - - 220
                          - 20
                          - 60
                        - - 119
                          - 11
                          - 32
                pipeline:
                    - type: LoadDELIVERImages
                    - bbox_format: xywh
                      img_scale:
                        - 512
                        - 512
                      keep_ratio: true
                      type: DELIVERResize
                    - type: PackDELIVERDetInputs
                test_mode: true
                type: DELIVERDetectionDataset
            drop_last: false
            num_workers: 2
            persistent_workers: true
            sampler:
                shuffle: false
                type: DefaultSampler
        val_evaluator:
            ann_file: /SSDb/jemo_maeng/dset/DELIVER/coco_val_xywh.json
            format_only: false
            metric: bbox
            type: CocoMetric
        vis_backends:
            - type: LocalVisBackend
        visualizer:
            name: visualizer
            type: DetLocalVisualizer
            vis_backends:
                - type: LocalVisBackend
        work_dir: ./work_dirs/deliver_cmnext_b2_faster_rcnn_2x_lr0.01
